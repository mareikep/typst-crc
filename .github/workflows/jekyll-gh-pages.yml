name: deploy-book

# Run this when the master or main branch changes
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# This job installs dependencies, builds the proposal and documentation, and pushes it to `gh-pages`
jobs:
  deploy-typst-crc:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo snap install just

      - name: Build the proposal
        run: |
          cd $GITHUB_WORKSPACE 
          make compile

      - name: Build the book
        run: |
          cd $GITHUB_WORKSPACE 
          make docs

      # Upload the book's HTML as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc

      # Deploy the book's HTML to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
